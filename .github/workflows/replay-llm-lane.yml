name: Replay LLM Lane (#1603)

# Manual-only replay lane: runs a pytest lane against the committed
# cassettes with NO API key provisioned (the anti-#1019 property is
# structural — there is nothing to fall through to), then enforces the
# anti-vacuité gate (live==0, hit>=1, miss_replay==0).
#
# DoD 7 (arming this on PR pushes) is a SEPARATE trigger PR, arbitrated —
# this workflow stays workflow_dispatch until then.
#
# ⚠ SUPERSEDED for band coverage (#2305, measured 2026-09-18). The
# `replay-band` job of requires_api_band.yml is the instrument of record: it
# provisions a DELIBERATE DUMMY key (replay-band-no-live-anti-1019, not a
# secret), which satisfies the requires_api skip guard so the tests ACTUALLY
# RUN, and it adds a dedicated "Egress guard — 0 outgoing LLM request,
# MEASURED" step on top of the anti-vacuité gate.
#
# The no-key property below reads as the stronger guarantee and is not: with
# no key, requires_api tests SKIP. A lane without a key does not prove replay
# holds — it proves the tests did not run. That is the exact vacuity the
# hit>=1 gate exists to catch, and the reason a skip is more dangerous than a
# red.
#
# This workflow is KEPT, not retired: it is the only surface taking an
# arbitrary `lane_args`, i.e. probing ONE test without firing the whole band.
# Its run history (3 runs, all 2026-08-17, none green) describes a
# work-in-progress afternoon, not non-utility — Cleanup Gate applies.
#
# A red gate here means one of:
#   - live>0   : impossible by construction (no key) — a wrap leaked
#   - hit==0   : the lane no longer consults the cache (vacuous green)
#   - miss>0   : a cassette is missing / its key drifted (record/replay
#                asymmetry — see #1603 constat C — or substitution)

on:
  workflow_dispatch:
    inputs:
      lane_args:
        description: 'pytest args selecting the replay lane (file and -k)'
        required: false
        default: 'tests/unit/argumentation_analysis/orchestration/test_workflow_robustness.py -k "test_empty_whitespace and light"'
      replay_db:
        description: 'Runtime diskcache dir for the replay DB'
        required: false
        default: '.cache/llm_replay_lane'

concurrency:
  group: replay-llm-lane
  cancel-in-progress: true

# #2326: --verify-run resolves the manifest's record_run_id against the
# record run's own logs — needs the actions read scope.
permissions:
  contents: read
  actions: read

jobs:
  replay:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # #1959 (JDK source unique): see ci.yml -- the setup-java step listed
      # Java 11 but was inert (find_existing_jdk ignores JAVA_HOME,
      # is_valid_jdk rejects any major < 15). Removed rather than bumped.
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        timeout-minutes: 15
        with:
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: projet-is
          use-mamba: true
          auto-update-conda: false

      - name: Count committed cassettes (guard against a vacuous lane)
        shell: pwsh
        run: |
          # MANIFEST.json is not a cassette (#2405): a dir holding only the
          # manifest must still read as empty here.
          $n = (Get-ChildItem tests/fixtures/llm_cassettes -Filter *.json | Where-Object Name -ne 'MANIFEST.json' | Measure-Object).Count
          Write-Host "Committed cassettes: $n"
          if ($n -lt 1) {
            Write-Host "FAIL-LOUD: no cassettes committed — the replay lane would be vacuous (hit would be 0)."
            exit 1
          }

      - name: Import cassettes into the runtime replay DB
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          # --verify-run (#2326): the manifest's record_run_id must resolve
          # against the record run's own "Exported cassettes: N" line — a
          # fabricated run id reddens before anything reaches the DB.
          python scripts/cassettes/import.py tests/fixtures/llm_cassettes ${{ inputs.replay_db }} --purge --verify-run
          python scripts/cassettes/cost_report.py ${{ inputs.replay_db }} | Select-Object -First 3

      # NO OPENAI_API_KEY is provisioned on this step or this job — replay
      # must hold with nothing to fall back to (anti-#1019, structural).
      - name: Replay lane (no key provisioned)
        shell: pwsh
        timeout-minutes: 30
        env:
          LLM_CACHE_MODE: replay
          LLM_CACHE_DIR: ${{ inputs.replay_db }}
          REPLAY_GATE: '1'
          REPLAY_STATS_OUT: replay_stats.json
        run: |
          conda run -n projet-is --no-capture-output pytest ${{ inputs.lane_args }} -p scripts.cassettes.replay_stats_plugin -v --junitxml=pytest_report.xml --timeout=900 --timeout-method=thread
          # #1759: this was the only pytest surface in CI without a per-test
          # bound (step timeout-minutes: 30 kills the JOB, losing the report);
          # --timeout=900 brings it to parity with the gate and every other
          # lane. Same caveat as those: thread is the only method on Windows
          # and aborts the run on fire — the dump in the log is the artifact.

      - name: Anti-vacuité gate (live==0, hit>=1, miss_replay==0)
        shell: pwsh
        run: python -m scripts.cassettes.replay_gate_check replay_stats.json

      - name: Upload lane report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-lane-report
          path: |
            replay_stats.json
            pytest_report.xml
          if-no-files-found: warn
