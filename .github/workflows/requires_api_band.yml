name: requires_api band (scheduled real-LLM lane)

# Scheduled lane for the test band the per-push gate CANNOT run: the tests
# marked `requires_api` make real LLM calls, so ci.yml deselects them
# (`-m "not slow and not requires_api"`, ci.yml "Run automated tests").
# Until this workflow existed, that band ran ONLY on whatever machine a
# human happened to use -- which is exactly how the #2282 JVM incident
# stayed invisible: CI was green certifying code-without-keys while the
# keys-without-CI side drifted. This lane is the missing half of the pair.
#
# SCOPE, measured 2026-09-18 on a CLEAN collection (the earlier figures were
# taken while 6 MCP collection errors interrupted the run -- repaired in
# #2288 + the same env defect on the coordinator machine):
#   -m "requires_api and llm_light", this argv .... 8 tests   (scheduled)
#   -m "requires_api",               this argv .... 59 tests  (full-band dispatch)
#   -m "requires_api",               tests/ whole .. 90 tests
# So this lane sees 59 of the band's 90 tests. The 31 it does NOT see live in
# 10 files outside the argv -- tests/integration/triage/ (6 files),
# tests/bench/test_spectacular_perf.py (excluded by design, 15+ min LLM),
# tests/agents/core/logic/test_modal_logic_agent_authentic.py,
# tests/integration/test_api_connectivity.py, test_growth_hook_corpus_a_597.py.
# Naming the gap is deliberate: a lane that silently covered 66% while its
# header said "the entire band" is the theater this lane exists to end.
# Widening the argv is a USER decision (#1867) and is filed in the registry.
#
# Cost: 8 tests x ~$0.01-0.05 => roughly $0.08-0.40 per scheduled run.
# Full-band dispatch is an on-demand operator action, never scheduled, so it
# cannot silently balloon.
#
# TWO-BAND SHAPE (#1603, dispatch R1021): the LIVE band below stays the 8
# llm_light tests with the real key and is NEVER widened to replay -- it is
# the probe that must keep touching the API. A lane gone fully replay would
# stop seeing a dead key, a moved endpoint or a retired model: exactly the
# false green #2286 was built to remove. The replay-band job covers the
# non-light requires_api tests from COMMITTED cassettes at zero marginal
# cost, under the anti-vacuity gate (live==0, hit>=1, miss_replay==0) and a
# MEASURED egress==0 guard. Cassettes are recorded by the manual, billing
# record-llm-cassettes.yml job -- the only workflow that ever pays for the
# replay half. A dummy key (not a secret) keeps the requires_api skip
# fixture satisfied while leaving nothing real to fall through to: any live
# attempt burns on 401 AND trips the egress guard.
#
# MEASURED SPLIT (2026-09-19, po-2023, on the workflow's own argv after the
# two #2300 deselects were REALLY removed — occurrence-counted 15 -> 13):
# of the 51 non-light tests, 23 replay green from cassettes with hit=76,
# miss_replay=0, live=0 and egress total 0 (counter report, ~46 s);
# 28 stay OUT, each with a measured reason (bypass traffic the
# cache cannot serve: 23; fatal miss -- cassette refused by the privacy audit
# or nondeterministic chain: 2; #2296 open defect: noted; env-flip tests that
# mutate LLM_CACHE_MODE mid-process: 3). #2300 returned its 2 tests (winner
# fallback canon + privacy currency-word exemption) — the earlier commit on
# this branch measured "21 passed" on a 15-flag argv: the original 23/hit=76
# figures were real but measured on a LOCAL argv the harness did not carry
# (coordinator review R1024); the flags are now actually gone and the numbers
# below are the harness's own. The deselect list and
# the full reasons live in the replay-band step below. The 23-test bypass
# family is the cassette infra's known boundary (#1789: SK-agent phases and
# direct-client tests bypass the cache wrap by construction).
#
# First scheduled run: Saturday 05:37 UTC -- off the :00 mark deliberately,
# per cluster convention on API-hitting cadences.

on:
  schedule:
    - cron: "37 5 * * 6"
  workflow_dispatch:
    inputs:
      full-band:
        description: "Run the whole requires_api band WITHIN this argv (59 tests measured 2026-09-18), not just the 8 llm_light ones"
        type: boolean
        default: false

# Scheduled runs must never supersede each other mid-run: a cancelled
# real-LLM run is money spent with no report.
concurrency:
  group: requires-api-band
  cancel-in-progress: false

permissions:
  contents: read
  actions: read  # #2326: --verify-run reads the record run's logs

jobs:
  requires-api:
    runs-on: windows-latest
    timeout-minutes: 180  # light band ~1h expected; full-band dispatch gets the headroom
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TEXT_CONFIG_PASSPHRASE: ${{ secrets.TEXT_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          # Privacy gate needs the history to diff origin/main..HEAD
          fetch-depth: 0

      - name: Privacy gate — scan indexed surfaces
        shell: pwsh
        run: python scripts/security/scan_indexed_surfaces.py --commits origin/main..HEAD

      - name: Check API keys availability
        id: check_secrets
        # #1799 pattern: the fail-loud summary below can only fire if this
        # var exists even when an upstream step died. Keep `if: always()`.
        if: always()
        shell: pwsh
        run: |
          if ("${{ secrets.OPENAI_API_KEY }}" -ne "") {
            echo "API_KEYS_CONFIGURED=true" >> $env:GITHUB_ENV
            Write-Host "✅ API keys are configured"
          } else {
            echo "API_KEYS_CONFIGURED=false" >> $env:GITHUB_ENV
            Write-Host "⚠️ OPENAI_API_KEY not configured - lane cannot run (it exists precisely to run WITH keys)"
          }

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        timeout-minutes: 15
        with:
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: projet-is
          use-mamba: true
          auto-update-conda: false

      # --- Java toolchain: same cache/provision/verify chain as the gate ---
      - name: Compute Java toolchain cache key
        if: env.API_KEYS_CONFIGURED == 'true'
        id: javakey
        shell: pwsh
        run: |
          $key = conda run -n projet-is --no-capture-output python scripts/ci/tweety_cache_key.py
          if (-not $key) { Write-Host "::error::cle de cache vide"; exit 1 }
          Write-Host "Cle: $key"
          echo "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore Java toolchain
        if: env.API_KEYS_CONFIGURED == 'true'
        id: javacache
        uses: actions/cache@v4
        with:
          path: |
            libs/tweety
            portable_jdk
          key: java-${{ runner.os }}-${{ steps.javakey.outputs.key }}

      - name: Provision Tweety classpath
        if: env.API_KEYS_CONFIGURED == 'true' && steps.javacache.outputs.cache-hit != 'true'
        shell: pwsh
        run: conda run -n projet-is --no-capture-output python scripts/ci/provision_tweety.py

      - name: Verify Java toolchain is usable
        if: env.API_KEYS_CONFIGURED == 'true'
        shell: pwsh
        run: conda run -n projet-is --no-capture-output python scripts/ci/verify_tweety.py

      - name: Run requires_api tests
        if: env.API_KEYS_CONFIGURED == 'true'
        # Same argv as the per-push gate (the #1341-measured collectable
        # scope), with the marker inverted: this lane selects exactly what
        # the gate deselects. Files marked requires_api that live OUTSIDE
        # this argv are not in this lane either -- admitting a new directory
        # requires its own measurement, per the #1341 convention.
        #
        # Collection errors here are a LOUD red, not noise: A0 (#2282) is
        # repairing the 6 known ones; if one resurfaces, this lane is the
        # instrument that says so.
        shell: pwsh
        run: |
          $marker = "requires_api and llm_light"
          if ("${{ inputs.full-band }}" -eq "true") { $marker = "requires_api" }
          Write-Host "Band marker: $marker"
          conda run -n projet-is --no-capture-output pytest tests/unit/ tests/scripts/ tests/orchestration/ tests/ui/ tests/utils/ tests/golden/ tests/core/ tests/config/ tests/property/ tests/argumentation_analysis/ tests/project_core/ tests/functional/ tests/integration/orchestration/ tests/integration/services/ tests/integration/workers/ tests/integration/api/ tests/test_fact_checking_integration.py tests/test_integration_success_validation.py tests/test_orchestration_integration.py tests/test_readme_quickstart.py tests/test_regression_golden.py -m "$marker" --junitxml=pytest_report.xml -v --timeout=900 --timeout-method=thread

      - name: Generate test summary (fail-loud)
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "═══════════════════════════════════════════════"
          Write-Host "📊 REQUIRES_API BAND SUMMARY"
          Write-Host "═══════════════════════════════════════════════"

          if (Test-Path pytest_report.xml) {
            # #1556: counters live on <testsuite>, not the <testsuites> root.
            [xml]$xml = Get-Content pytest_report.xml
            $suites = @($xml.testsuites.testsuite)
            $total = 0; $errors = 0; $failures = 0; $skipped = 0
            foreach ($s in $suites) {
              $total    += [int]$s.tests
              $errors   += [int]$s.errors
              $failures += [int]$s.failures
              $skipped  += [int]$s.skipped
            }
            $passed = $total - $errors - $failures - $skipped

            Write-Host "✅ Passed:  $passed / $total"
            Write-Host "❌ Failed:  $($errors + $failures) / $total"
            Write-Host "⏭️  Skipped:  $skipped / $total"

            # Dead-band guard (sibling of #1385/#1799): this lane exists to
            # run a NON-EMPTY set of real-LLM tests. 0 collected with keys
            # configured means the band rotted -- marker renamed, pytest.ini
            # reorganized, files moved out of the argv -- and a green badge
            # on an empty band is the assertion-that-cannot-fail
            # anti-pattern. Fail loud and say what to check.
            if ($env:API_KEYS_CONFIGURED -eq 'true' -and $total -eq 0) {
              Write-Host "❌ FAIL-LOUD: 0 tests collected with keys configured."
              Write-Host "   The requires_api band is EMPTY -- check marker spelling in pytest.ini,"
              Write-Host "   llm_light marker existence, and that the files still live under the argv scope."
              exit 1
            }

            if ($skipped -gt 0) {
              Write-Host ""
              Write-Host "ℹ️  $skipped skips on a keys-configured run -- inspect the junit artifact:"
              Write-Host "   legitimate skips exist (per-test preconditions) but a skip storm is the"
              Write-Host "   exact signature this lane was built to catch (#2282)."
            }
          } else {
            # #1799 fork, adapted: on THIS lane there is no honest-absence
            # case. Unlike the per-push gate, a run without keys is not
            # "expected for forks" -- it is a configuration failure of the
            # lane itself (scheduled runs on the main repo always have keys).
            if ($env:API_KEYS_CONFIGURED -eq 'true') {
              Write-Host "❌ FAIL-LOUD (#1799): keys were configured and pytest was expected to run, but no pytest_report.xml exists."
              Write-Host "   The suite did NOT run (setup timeout, pytest hang, or conda run died)."
              Write-Host "   'Not measured', not 'measured and green'."
              exit 1
            } else {
              Write-Host "❌ FAIL-LOUD: this lane ran WITHOUT API keys. There is no honest-skip story here:"
              Write-Host "   the OPENAI_API_KEY secret is missing/blocked for scheduled runs on this repo."
              exit 1
            }
          }
          Write-Host "═══════════════════════════════════════════════"

      - name: Fail-loud guard — JVM-startup skip family (#1385/#1873 pattern)
        # Match the FAMILY of conftest JVM-skip signatures ("Saut du test car
        # ...JVM"), never one literal, never the raw skip rate. On this lane
        # even ONE JVM skip with keys configured is an environment defect by
        # definition (#2282): the toolchain steps above verified the JVM
        # before pytest started.
        if: always() && env.API_KEYS_CONFIGURED == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path pytest_report.xml)) {
            Write-Host "ℹ️ No pytest_report.xml — JVM guard skipped (failure already captured upstream)."
            exit 0
          }
          [xml]$xml = Get-Content pytest_report.xml
          $jvmSkips = @()
          foreach ($s in @($xml.testsuites.testsuite)) {
            foreach ($tc in @($s.testcase)) {
              foreach ($sk in @($tc.skipped)) {
                if ($sk.message -match 'JVM') { $jvmSkips += "$($tc.classname)::$($tc.name)" }
              }
            }
          }
          if ($jvmSkips.Count -gt 0) {
            Write-Host "❌ FAIL-LOUD (#1385 family): $($jvmSkips.Count) test(s) skipped on a JVM signature:"
            $jvmSkips | Select-Object -First 10 | ForEach-Object { Write-Host "   - $_" }
            Write-Host "   The Verify Java toolchain step passed before pytest ran -- a JVM skip now means"
            Write-Host "   the runtime degraded DURING the run (classpath drift, JVM crash). This is the #2282 canary."
            exit 1
          }
          Write-Host "✅ 0 JVM-signature skips."

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: requires-api-band-results
          path: |
            pytest_report.xml
            llm_egress_report.json

  # ─────────────────────────────────────────────────────────────────────
  # REPLAY BAND (#1603): the non-light requires_api tests against committed
  # cassettes, at zero marginal cost. Runs in parallel with the live band --
  # its failure never blocks the live probe's report and vice versa.
  #
  # Local measurement that shaped this job (2026-09-18, po-2023): the first
  # probe (dummy key, empty cache) came back hit=0 -- and the root was NOT
  # the cache: every extraction call had been 400ing since the default model
  # moved to gpt-5.6-luna (max_tokens spelling, repaired in the #1603 PR --
  # see invoke_callables.py). Post-repair, the classification replay on the
  # exact lane argv measures: 20 passed, hit=52, miss_replay=0, live=0,
  # egress total 0, gate OK. Part of the traffic BYPASSES the cache by
  # construction (SK-agent phases, direct-client tests) and is DESELECTED
  # below with the measured reason -- recorded in the PR, never silently
  # dropped.
  # ─────────────────────────────────────────────────────────────────────
  replay-band:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      # Dummy, deliberately NOT a secret: satisfies the requires_api skip
      # fixture (which checks key PRESENCE) while leaving nothing real to
      # call. Any live attempt burns on 401 AND trips the egress guard.
      OPENAI_API_KEY: replay-band-no-live-anti-1019
      TEXT_CONFIG_PASSPHRASE: ${{ secrets.TEXT_CONFIG_PASSPHRASE }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        timeout-minutes: 15
        with:
          python-version: "3.10"
          environment-file: environment.yml
          activate-environment: projet-is
          use-mamba: true
          auto-update-conda: false

      # --- Java toolchain: same chain as the live band (JVM-face tests) ---
      - name: Compute Java toolchain cache key
        id: javakey
        shell: pwsh
        run: |
          $key = conda run -n projet-is --no-capture-output python scripts/ci/tweety_cache_key.py
          if (-not $key) { Write-Host "::error::cle de cache vide"; exit 1 }
          echo "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore Java toolchain
        id: javacache
        uses: actions/cache@v4
        with:
          path: |
            libs/tweety
            portable_jdk
          key: java-${{ runner.os }}-${{ steps.javakey.outputs.key }}

      - name: Provision Tweety classpath
        if: steps.javacache.outputs.cache-hit != 'true'
        shell: pwsh
        run: conda run -n projet-is --no-capture-output python scripts/ci/provision_tweety.py

      - name: Verify Java toolchain is usable
        shell: pwsh
        run: conda run -n projet-is --no-capture-output python scripts/ci/verify_tweety.py

      - name: Count committed cassettes (guard against a vacuous lane)
        shell: pwsh
        run: |
          $n = (Get-ChildItem tests/fixtures/llm_cassettes -Filter *.json | Measure-Object).Count
          Write-Host "Committed cassettes: $n"
          if ($n -lt 1) {
            Write-Host "FAIL-LOUD: no cassettes committed -- the replay band would be vacuous (hit would be 0)."
            exit 1
          }

      - name: Import cassettes into the runtime replay DB
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_API_URL: ${{ github.api_url }}
        run: |
          # --verify-run (#2326): the manifest's record_run_id must resolve
          # against the record run's own "Exported cassettes: N" line — a
          # fabricated run id reddens before anything reaches the DB.
          python scripts/cassettes/import.py tests/fixtures/llm_cassettes .cache/llm_replay_band --purge --verify-run
          python scripts/cassettes/cost_report.py .cache/llm_replay_band | Select-Object -First 3

      - name: Replay band (dummy key -- nothing real to fall through to)
        shell: pwsh
        timeout-minutes: 90
        env:
          LLM_CACHE_MODE: replay
          LLM_CACHE_DIR: .cache/llm_replay_band
          REPLAY_GATE: '1'
          REPLAY_STATS_OUT: replay_stats.json
        # The 13 deselect flags below (occurrence-counted after the #2300
        # removal — the previous commit claimed 13 while the run line still
        # carried 15: a purely-commentary hunk, caught by coordinator review
        # R1024) cover 28 of the 51 non-light tests,
        # each with a MEASURED reason (classification replay, dummy key,
        # po-2023 2026-09-18, post max_tokens-repair record):
        #   - BYPASS, 23 tests: their traffic never consults the cache, so on
        #     a dummy key they attempt real egress (measured: golden standard
        #     family 18 attempts/test, FOL value-gate 4, sk-path 3, fallacy
        #     benchmark 2, judge 1, config_real_gpt 1x3) — they would trip the
        #     egress guard below, and cassettes cannot cover them by design.
        #   - FATAL MISS, 2 tests: their cache keys have no cassette (responses
        #     refused by the blocking privacy audit, or nondeterministic
        #     chained prompts) — LLMCacheMiss is fail-loud by contract.
        #   - #2296 (3 of the bypass set also fail on belief_sets: 0 < 1 with
        #     a real key) owns its return into this band.
        #   - ENV-FLIP, 2 tests (+ sk-path above): they set LLM_CACHE_MODE
        #     mid-process for their own record/replay cycle — incompatible
        #     with a global replay session.
        #   - #2300 RETURNED (2 tests, REALLY un-deselected this time — flags
        #     removed from the run line below): the winner is None defect is
        #     repaired (aggregate-level fallback canon condorcet -> majority ->
        #     plurality, #2300) and their cassettes pass the privacy audit
        #     (currency-word exemption). The delegation test's nondeterministic
        #     wide-net branch (2 SK-path keys never recorded; flaky 2/3 red
        #     on main pre-#2300) is now cassette-covered on both branches.
        #   - WALK-VARIANCE RETURNED (#2324 PR B): the delegation test was
        #     deselected by #2323 because its fallacy walk's SHAPE was chosen
        #     by the LLM per session, so a replay walked candidates the record
        #     never saw (record job 35474667181: 8 miss_replay, all SK nav
        #     prompts). #2324 PR A (#2387) pinned the walk; the band
        #     cassettes are re-recorded on main b9e321ef (record job
        #     35792294382, 22/22 passed, 276 exported, 0 refused) with the
        #     delegation test IN the recorder's argv, so it replays here.
        # Validated on THIS workflow's argv (13 --deselect flags), on the
        # runner, against the committed cassettes of record 35792294382:
        # band run 35797422276 (2026-09-23) — 22 passed, 0 skipped, the
        # delegation test among them; hit=699, miss_replay=0, live=0; egress
        # report llm_outcomes {} (zero LLM requests). Earlier figures in this
        # comment (21/23 passed, hit=72/76) measured other argvs and older
        # cassettes; they no longer describe this step.
        run: |
          $marker = "requires_api and not llm_light"
          Write-Host "Band marker: $marker"
          conda run -n projet-is --no-capture-output pytest tests/unit/ tests/scripts/ tests/orchestration/ tests/ui/ tests/utils/ tests/golden/ tests/core/ tests/config/ tests/property/ tests/argumentation_analysis/ tests/project_core/ tests/functional/ tests/integration/orchestration/ tests/integration/services/ tests/integration/workers/ tests/integration/api/ tests/test_fact_checking_integration.py tests/test_integration_success_validation.py tests/test_orchestration_integration.py tests/test_readme_quickstart.py tests/test_regression_golden.py -m "$marker" --deselect "tests/test_regression_golden.py::TestGoldenStandardWorkflow" --deselect "tests/unit/argumentation_analysis/orchestration/test_regression_golden.py::TestGoldenIntegration::test_run_unified_analysis_standard_thresholds" --deselect "tests/unit/argumentation_analysis/test_value_gates.py::TestFOLValueGate::test_fol_consistent_is_bool_when_tweety_available" --deselect "tests/integration/orchestration/test_replay_cache_sk_path.py" --deselect "tests/unit/argumentation_analysis/evaluation/test_fallacy_benchmark.py::TestModeRunners::test_mode_c_constrained" --deselect "tests/unit/argumentation_analysis/evaluation/test_judge_advanced.py::TestEvaluateMethod::test_evaluate_with_api" --deselect "tests/config/test_config_real_gpt.py" --deselect "tests/integration/api/test_deliberation_genuine_verdict.py::TestDeliberationGenuineVerdictViaAPI::test_deliberation_decides_governance_firsthand_via_http" --deselect "tests/unit/argumentation_analysis/orchestration/test_fact_extraction_opposing_poles_1745.py::TestInventoryCarriesBothPoles::test_inventory_carries_both_poles_of_explicit_opposition" --deselect "tests/unit/argumentation_analysis/workflows/test_democratech.py::TestDemocratechE2EGenuineFirsthand::test_governance_decides_firsthand_on_multi_option_proposition" --deselect "tests/scripts/test_proof_bo2b_dashboard_1493.py::test_proof_script_cli_real_llm_path" --deselect "tests/integration/orchestration/test_replay_cache_determinism.py::TestReplayCacheDeterminism::test_record_then_replay_yields_identical_governance_verdict" --deselect "tests/integration/orchestration/test_replay_cache_profiling_batch.py::TestReplayCacheProfilingBatch::test_batch_record_then_replay_zero_live_and_profiled" -p scripts.cassettes.replay_stats_plugin --junitxml=pytest_report_replay.xml -v --timeout=900 --timeout-method=thread

      - name: Anti-vacuity gate (live==0, hit>=1, miss_replay==0)
        if: always()
        shell: pwsh
        run: python -m scripts.cassettes.replay_gate_check replay_stats.json

      - name: Egress guard — 0 outgoing LLM request, MEASURED (#1603 DoD)
        # The dummy key makes any live attempt a 401, but "attempted" is
        # already a violation: this band's contract is zero egress. The
        # egress counter (#1787) is the measurer; an absent report is NOT a
        # zero (its own motto: 0 without the counter running is
        # indistinguishable from an unwired counter).
        if: always()
        shell: pwsh
        run: |
          $reports = Get-ChildItem -Filter "llm_egress_report*.json"
          if (-not $reports) {
            Write-Host "FAIL-LOUD: no egress report found -- the counter did not run; absence is not zero."
            exit 1
          }
          $total = 0
          foreach ($r in $reports) {
            $j = Get-Content $r.FullName -Raw | ConvertFrom-Json
            Write-Host "$($r.Name): total=$($j.total)"
            $total += [int]$j.total
          }
          if ($total -gt 0) {
            Write-Host "FAIL-LOUD: replay band made $total outgoing LLM request(s) -- replay must hold with zero egress."
            exit 1
          }
          Write-Host "OK: 0 outgoing LLM requests across $($reports.Count) report(s)."

      - name: Upload replay artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-band-results
          path: |
            replay_stats.json
            pytest_report_replay.xml
            llm_egress_report*.json
          if-no-files-found: warn
