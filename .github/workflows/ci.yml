name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# Since secrets were configured (#1303) every run executes the LLM-dependent
# suite — concurrent duplicate runs bill real API usage. A new push to a ref
# supersedes the in-flight run for that ref (per-PR refs stay independent).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        timeout-minutes: 15  # Protection contre timeouts
        with:
          python-version: "3.10"  # FIX: guillemets pour éviter 3.1
          environment-file: environment.yml
          activate-environment: projet-is
          use-mamba: true  # Résolution 5-10x plus rapide
          auto-update-conda: false  # Évite instabilités cache

      - name: Check code formatting
        shell: pwsh
        continue-on-error: true  # Informational — codebase not yet fully black-formatted
        run: |
          conda run -n projet-is --no-capture-output black --check --diff argumentation_analysis/ tests/ api/ project_core/

      - name: Check code linting
        shell: pwsh
        continue-on-error: true  # Informational — many pre-existing flake8 warnings
        run: |
          conda run -n projet-is --no-capture-output flake8 argumentation_analysis/ tests/ api/ project_core/

      - name: Type check (mypy strict — core orchestration)
        shell: pwsh
        run: |
          conda run -n projet-is --no-capture-output python -m mypy --config-file pyproject.toml argumentation_analysis/core/capability_registry.py argumentation_analysis/core/shared_state.py argumentation_analysis/orchestration/workflow_dsl.py argumentation_analysis/orchestration/registry_setup.py argumentation_analysis/orchestration/workflows.py argumentation_analysis/orchestration/invoke_callables.py argumentation_analysis/orchestration/state_writers.py argumentation_analysis/agents/factory.py

  automated-tests:
    runs-on: windows-latest
    # Run tests independently of lint — lint failures should not block test execution
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # #1959 (JDK source unique): the setup-java step was inert and listed
      # Java 11, contradicting settings.jvm.jdk_version (17.0.12, provisioned
      # by provision_tweety.py into portable_jdk/). find_existing_jdk() ignores
      # JAVA_HOME entirely and is_valid_jdk rejects any major < 15, so the
      # JDK installed here was never examined. Removed rather than bumped to
      # 17 -- a parallel source of truth would re-derive at the next bump.
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        timeout-minutes: 15  # Protection contre timeouts
        with:
          python-version: "3.10"  # FIX: guillemets pour éviter 3.1
          environment-file: environment.yml
          activate-environment: projet-is
          use-mamba: true  # Résolution 5-10x plus rapide
          auto-update-conda: false  # Évite instabilités cache

      # Provision the React frontend build so the Starlette app imports cleanly
      # (interface_web/app.py mounts StaticFiles(directory=.../build) at module
      # import — the build dir is gitignored, CLAUDE.md prerequisite). Without
      # this, 29 starlette/proxy tests skip via the #1363 skipif (honest absence).
      # With it, CI genuinely tests the starlette surface (#1362 real fix).
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # LTS, compatible with react-scripts 5.0.1
          cache: 'npm'
          cache-dependency-path: services/web_api/interface-web-argumentative/package-lock.json

      - name: Build React frontend
        working-directory: services/web_api/interface-web-argumentative
        shell: pwsh
        run: |
          npm ci --no-audit --no-fund
          npm run build
          Write-Host "✅ React build produced: $((Get-ChildItem -Recurse build | Measure-Object).Count) files"

      - name: Check API keys availability
        id: check_secrets
        # #1799: `Generate test summary` fails loud when the report is absent
        # while keys were configured. It can only do that if this var exists
        # even when an upstream step failed — a Setup Miniconda timeout skips
        # every between-step, so without `if: always()` here the fail-loud
        # condition would never fire in exactly the scenario it exists for.
        if: always()
        shell: pwsh
        run: |
          if ("${{ secrets.OPENAI_API_KEY }}" -ne "") {
            echo "API_KEYS_CONFIGURED=true" >> $env:GITHUB_ENV
            Write-Host "✅ API keys are configured"
          } else {
            echo "API_KEYS_CONFIGURED=false" >> $env:GITHUB_ENV
            Write-Host "⚠️ OPENAI_API_KEY not configured - tests will be skipped"
          }

      # --- #1874 : cache de la chaine Java ---------------------------------
      # Le canal fat-jar (tweetyproject.org/builds/) a ete supprime en amont, donc
      # le classpath est desormais ASSEMBLE depuis Maven Central a chaque run :
      # mesure 165 s sur le run 32768195554 (19:37:59 -> 19:40:44), plus le
      # telechargement du JDK 17 portable. Ni l'un ni l'autre ne depend du commit.
      #
      # Ceci retire un COUT, ca ne debloque rien : la porte a ete debloquee par
      # l'assemblage lui-meme (15010 skipped/0 passed -> 14775 passed). Dit
      # explicitement pour que le prochain lecteur ne prenne pas le cache pour le
      # correctif.
      #
      # La cle est derivee de settings (version + pins + exclusions + coordonnees
      # du JDK), PAS d'un artefact heberge : un artefact epingle en amont est
      # exactement ce qui est mort dans #1874. Changer une coordonnee change la
      # cle, donc la fermeture se reconstruit seule, sans geste humain.
      - name: Compute Java toolchain cache key
        if: env.API_KEYS_CONFIGURED == 'true'
        id: javakey
        shell: pwsh
        run: |
          $key = conda run -n projet-is --no-capture-output python scripts/ci/tweety_cache_key.py
          if (-not $key) { Write-Host "::error::cle de cache vide"; exit 1 }
          Write-Host "Cle: $key"
          echo "key=$key" >> $env:GITHUB_OUTPUT

      - name: Restore Java toolchain
        if: env.API_KEYS_CONFIGURED == 'true'
        id: javacache
        uses: actions/cache@v4
        with:
          path: |
            libs/tweety
            portable_jdk
          # Pas de restore-keys : un prefixe partiel restaurerait le classpath
          # d'une AUTRE version, que la porte version-specifique refuserait de
          # toute facon -- on paierait la restauration pour rien, et un lecteur
          # verrait "cache hit" juste avant un assemblage complet.
          key: java-${{ runner.os }}-${{ steps.javakey.outputs.key }}

      - name: Provision Tweety classpath
        if: env.API_KEYS_CONFIGURED == 'true' && steps.javacache.outputs.cache-hit != 'true'
        shell: pwsh
        run: conda run -n projet-is --no-capture-output python scripts/ci/provision_tweety.py

      # Tourne sur les DEUX chemins, hit comme miss. Sur un miss il redit ce que
      # l'assemblage vient de verifier ; sur un HIT il est le seul controle qui
      # existe : actions/cache annonce un hit pour ce qu'il a stocke, meme si
      # c'etait un assemblage partiel, et un classpath partiel demarre la JVM puis
      # fait echouer chaque import -- en skips, pas en erreur.
      - name: Verify Java toolchain is usable
        if: env.API_KEYS_CONFIGURED == 'true'
        shell: pwsh
        run: conda run -n projet-is --no-capture-output python scripts/ci/verify_tweety.py

      - name: Run automated tests
        if: env.API_KEYS_CONFIGURED == 'true'
        # Gate scope (#1336/#1341): tests/unit + tests/scripts, LLM- and
        # slow-marked tests excluded. The full suite cannot be a per-push gate:
        # integration tests spawn a JVM subprocess or make real LLM calls
        # (~1 test/min — the 2026-07-01 full run reached 2% of 14k tests in 6h
        # before GitHub's job limit killed it), and tests/bench runs 15+ min LLM
        # benchmarks by design. Integration/e2e/bench/LLM lanes need a scheduled
        # or on-demand workflow, not this gate.
        #
        # #1563: the gate ran tests/unit ONLY, so tests/scripts — which holds
        # the orchestration-comparison harness suite, i.e. the tests guarding
        # every number Epic #1500 reports — never executed in CI. A PR touching
        # only the harness went green having run none of its own tests; the
        # compensating control was a hand-cited local run, which is not a gate.
        # Widened ONE directory at a time under a MEASURED budget, never to
        # tests/ wholesale (#1341 was slowness, and re-including it in bulk is
        # the pendulum). Measured on projet-is, same marker filter:
        #   tests/scripts       → 129 passed, 2 deselected, 22.7s   → ADMITTED
        #   tests/orchestration → still running at 10 min, killed   → EXCLUDED
        # The next candidate directory needs its own measurement, not this
        # precedent. The tally in the summary below is the proof the widening
        # took effect: it must rise by ~129 on the first run after this change.
        # Backstop below the 6h GitHub job default; --timeout converts a hung
        # test into a failure with a stack dump of every thread (thread method
        # is the only one available on Windows; it aborts the run on fire, so
        # the dump in the log — not the junitxml — is the diagnostic artifact).
        timeout-minutes: 240
        shell: pwsh
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TEXT_CONFIG_PASSPHRASE: ${{ secrets.TEXT_CONFIG_PASSPHRASE }}
        run: |
          # #1816: tests/integration/api/ readmitted — its module-level spacy
          # sys.modules mock leaked at collection and reddened 3 tests/unit
          # victims at distance (#1814 veto). The stubs now live in an
          # install/import/restore window, so admission is safe; the 2
          # genuine-verdict LLM tests in that dir are requires_api-marked and
          # stay deselected by the gate filter.
          #
          # #1967: 15 files at tests/test_*.py (root) were outside the argv —
          # 9 of them are 0-byte shells (collect nothing), 6 are substantive.
          # Of those 6, 3 carry no markers and were never collected by any lane:
          #   - test_fact_checking_integration: 22 tests, all mock-based
          #   - test_integration_success_validation: 21 tests, all mock-based
          #   - test_orchestration_integration: 10 tests, mock-based
          # 1 marks requires_api on one of three classes and was paying 45 LLM
          # calls in a double angle mort:
          #   - test_regression_golden: 17 TestGoldenLightWorkflow + 2
          #     TestRegressionSnapshots + 14 TestGoldenStandardWorkflow (the
          #     last correctly marked). The light/snapshot classes do produce
          #     LLM egress (measured 45 calls/collection run — see #1967);
          #     they belong in unit-api, exactly like logical_agents in #1817.
          # 1 has 9 stale assertions dating from #418 and was red since #449
          # (118 days, invisible because no lane names the file):
          #   - test_readme_quickstart: 14 tests, realigned in this PR.
          # The shell files (test_informal_*, test_operational_agents_*,
          # test_pythonpath, test_tactical_*) collect 0 tests and contribute
          # nothing whether we name them or not.
          #
          # #1969 (R900): test_complex_trace_authentic.py is NOT in the argv
          # here, despite being substantive. Reason: ``--collect-only`` on it
          # returns 0 (its 3 ``def test_*`` are commented out at l.594+), so
          # naming it would not add a test, only a fragile import. The
          # authentic-LLM machinery in that file is un-marked ``requires_api``
          # and targets ``gpt-5-mini`` (obsolete since #1930). Leaving the
          # file un-named keeps the argv clean until the file is either
          # revived with current markers or archived -- whichever the next
          # maintainer decides.
          #
          # Glob the 6 substantive files explicitly so the 6 empty shells do
          # not bloat the argv and so a future empty stub cannot sneak into a
          # lane named after it.
          conda run -n projet-is --no-capture-output pytest tests/unit/ tests/scripts/ tests/orchestration/ tests/ui/ tests/utils/ tests/golden/ tests/core/ tests/config/ tests/property/ tests/argumentation_analysis/ tests/project_core/ tests/functional/ tests/integration/orchestration/ tests/integration/services/ tests/integration/workers/ tests/integration/api/ tests/test_fact_checking_integration.py tests/test_integration_success_validation.py tests/test_orchestration_integration.py tests/test_readme_quickstart.py tests/test_regression_golden.py -m "not slow and not requires_api" --junitxml=pytest_report.xml -v --timeout=900 --timeout-method=thread

      - name: Generate test summary
        if: always()
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "═══════════════════════════════════════════════"
          Write-Host "📊 TEST EXECUTION SUMMARY"
          Write-Host "═══════════════════════════════════════════════"
          
          if (Test-Path pytest_report.xml) {
            [xml]$xml = Get-Content pytest_report.xml
            # #1556: pytest porte les compteurs sur <testsuite>, pas sur la
            # racine <testsuites>. Lire la racine renvoyait '' donc 0 à TOUS les
            # runs — d'où un "Passed: 0 / 0" affiché aussi bien sur 13161 tests
            # passés que sur une suite entièrement sautée, ce qui a rendu le
            # skip storm de fd07420f invisible.
            $suites = @($xml.testsuites.testsuite)
            $total = 0; $errors = 0; $failures = 0; $skipped = 0
            foreach ($s in $suites) {
              $total    += [int]$s.tests
              $errors   += [int]$s.errors
              $failures += [int]$s.failures
              $skipped  += [int]$s.skipped
            }
            $passed = $total - $errors - $failures - $skipped
            
            Write-Host "✅ Passed:  $passed / $total"
            Write-Host "❌ Failed:  $($errors + $failures) / $total"
            Write-Host "⏭️  Skipped: $skipped / $total"
            
            if ($skipped -gt 0) {
              Write-Host ""
              Write-Host "ℹ️  Note: $skipped tests were skipped (likely due to missing API keys)"
              Write-Host "   These tests require OPENAI_API_KEY or other API credentials."
              Write-Host "   Configure secrets in GitHub repository settings to run them."
            }
          } else {
            # #1799: two reasons the report can be absent, and they must NOT
            # render the same. (a) API keys unset → pytest skipped by the
            # `if:` on the Run automated tests step → honest absence, exit 0.
            # (b) Keys configured but NO report → the suite never ran:
            # Setup Miniconda could not build the env (the #1799 timeout), the
            # pytest step itself timed out, or `conda run` died before writing
            # the junitxml. That is "not measured" — a FAILURE that decided
            # nothing, indistinguishable from a real test failure to a reader of
            # the rollup badge. Rendering it as success would be theater;
            # rendering it as a plain step failure keeps the old message ("tests
            # may have been skipped") which is exactly the fork-case wording.
            # So: when keys were configured, fail LOUD and say what happened.
            if ($env:API_KEYS_CONFIGURED -eq 'true') {
              Write-Host "❌ FAIL-LOUD (#1799): keys were configured and pytest was expected to run, but no pytest_report.xml exists."
              Write-Host "   The suite did NOT run (build/setup timed out, or pytest died before writing the report)."
              Write-Host "   This job's failure decides nothing about the code — it is 'not measured', not 'measured and red'."
              Write-Host "   Check the Setup Miniconda step in this job's log for a timeout, or the pytest step for a hang."
              exit 1
            } else {
              Write-Host "⚠️  No test report generated (tests may have been skipped)"
              Write-Host ""
              Write-Host "ℹ️  API keys not configured - all tests requiring APIs were skipped"
              Write-Host "   This is expected behavior for forks and external contributions"
            }
          }
          Write-Host "═══════════════════════════════════════════════"

      - name: Fail-loud guard — JVM-startup skip storm (#1385, anti-théâtre #1019)
        # A JVM-startup failure on the runner makes an autouse conftest guard
        # skip ~98% of the suite, and with 0 failures the job concludes
        # "success" — a green badge from an infra failure that decided
        # nothing (#1385).
        #
        # #1873: this guard used to match ONE literal ("JVM n'est pas
        # réellement démarrée"). #1641 later split the conftest guard into
        # THREE distinct messages so the grave case (init decided-failed)
        # could be told apart from the transient ones — and the severe half
        # landed in the blind spot: run 32706721429 printed
        # "0 / 15010 (0%) ✅ OK" on a 15010-skip storm and the job passed.
        # A guard that ASSERTS OK is worse than a silent one.
        #
        # So match the FAMILY of signatures, not one member. The three live
        # in tests/conftest.py and all share "Saut du test car ...JVM":
        #   1. l'initialisation de la JVM a échoué dans pytest_sessionstart
        #   2. la JVM n'est pas réellement démarrée (isJVMStarted() = False)
        #   3. la JVM est démarrée mais non fonctionnelle (health check)
        # If you add a fourth, it must keep that shape or widen $jvmPattern.
        #
        # Still targeted to the JVM skip messages, NOT the raw skip rate, so
        # legitimate skips (orphan-model, build-absent, requires_api) never
        # trip it. Do NOT "fix" a future storm by moving to the raw rate.
        if: always() && env.API_KEYS_CONFIGURED == 'true'
        shell: pwsh
        run: |
          if (-not (Test-Path pytest_report.xml)) {
            Write-Host "ℹ️ No pytest_report.xml — JVM-startup guard skipped (tests produced no report; failure already captured upstream)."
            exit 0
          }
          [xml]$xml = Get-Content pytest_report.xml
          # #1556: les compteurs sont sur <testsuite>, pas sur la racine
          # <testsuites>. Lire la racine donnait $total = 0 à tous les runs, ce
          # qui rendait la branche "exit 1" ci-dessous INATTEIGNABLE par
          # construction : le run 30360430769 a compté 13202 skips JVM sur un
          # total lu à 0, puis a imprimé son message de succès.
          $total = 0
          foreach ($s in @($xml.testsuites.testsuite)) { $total += [int]$s.tests }
          $content = Get-Content pytest_report.xml -Raw
          # #1873: famille de signatures, pas un littéral unique.
          #
          # Version remplacée (main) : UN littéral, $jvmSignature = "JVM n'est
          # pas réellement démarrée", injecté via [regex]::Escape. Mesuré sur
          # les 206 littéraux pytest.skip de tests/ : il en matche exactement 1.
          # Sur les TROIS messages que #1641 a séparés dans jvm_session, il n'en
          # voit qu'un — et c'est le plus bénin. Celui qui lui échappe d'abord,
          # "Saut du test car l'initialisation de la JVM a échoué dans
          # pytest_sessionstart.", est précisément la moitié grave : c'est ce
          # trou qu'a emprunté le run 32706721429 (0 / 15010, ✅ OK, success).
          #
          # Le motif actuel en matche 35, dont 32 hors conftest. Quatre exemples
          # de ces littéraux, qui sautent pour la même cause sans porter le
          # littéral de main --
          #   "Test nécessite la JVM."                    (16 testcases)
          #   "JVM non disponible pour dung_classes."
          #   "TweetyBridge JVM non disponible…"
          #   "JVM not started — cannot exercise…"
          # Ils sont invisibles aujourd'hui SEULEMENT parce que la fixture
          # autouse jvm_session les préempte ; tout ce qui la contourne
          # (--disable-jvm-session, is_e2e_session) convertirait une vraie
          # tempête en "0 match → ✅ OK". Le motif couvre donc le token JVM
          # dans n'importe quel message de skip, pas un préfixe.
          #
          # Le motif est ancré sur <skipped …>, pas sur message= : la version
          # précédente matchait aussi <failure message="… JVM …">, ce que son
          # propre commentaire niait. Contrôle discriminant (12 cas) : les 3
          # messages conftest + les 4 ci-dessus matchent ; "needs
          # USE_REAL_JPYPE=true", "set USE_REAL_JPYPE=true…", "Orphan model…
          # (B-06 #810)", une dépendance optionnelle et un <failure> citant la
          # JVM ne matchent pas. Les 244 skips légitimes du run 32744198742
          # restent donc hors du numérateur — l'anti-pendule tient.
          #
          # Le token est insensible à la casse, et ce n'est pas cosmétique :
          # [regex]::Matches est sensible à la casse en .NET, si bien que trois
          # messages nommant la MÊME cause lui échappaient parce qu'ils écrivent
          # le token en minuscules — "Dépendance 'jvm_session' non résolue…",
          # "belief_revision_classes: jpype_instance (integration_jvm) est
          # None." et "Skipping test: jvm_session fixture failed to initialize."
          # Les deux derniers se déclenchent exactement quand jvm_session vaut
          # None, c'est-à-dire la tempête elle-même.
          #
          # Mesuré sur les 206 littéraux pytest.skip de tests/ : le motif passe
          # de 32 à 35, et les 3 gagnés sont ceux-là. Les 13 littéraux citant
          # Tweety/jpype qui restent DEHORS y restent à dessein — "Test
          # nécessite USE_REAL_JPYPE=true", "Real Tweety not available",
          # "TweetyBridge non disponible" : ce sont des skips d'opt-in, ils
          # tombent sur un run sain (les 27 du bucket USE_REAL_JPYPE). Les
          # admettre transformerait le garde en taux de skip brut, exactement le
          # pendule que le paragraphe ci-dessus interdit.
          $jvmPattern = '<skipped[^>]*message="[^"]*[Jj][Vv][Mm]'

          $jvmSkipCount = ([regex]::Matches($content, $jvmPattern)).Count
          # Un rapport présent dont le total est nul n'est pas un succès : soit
          # la suite n'a rien exécuté, soit le parse est cassé. Les deux doivent
          # être bruyants — c'est très exactement le trou par lequel #1556 est
          # passé inaperçu (le garde se désarmait lui-même en silence).
          if ($total -le 0) {
            Write-Host "❌ FAIL-LOUD: pytest_report.xml présent mais total illisible ou nul ($total)."
            Write-Host "   Le run n'a décidé de rien — un badge vert ici serait du théâtre (#1556, #1385, #1019)."
            exit 1
          }
          $pct = [math]::Round(100 * $jvmSkipCount / $total)
          Write-Host "🔍 JVM-startup guard: $jvmSkipCount / $total tests ($pct%) skipped with a JVM signature."
          # Ventilation : nommer la cause dominante fait gagner le premier
          # quart d'heure du prochain incident (init décidée-échouée =>
          # amont/setup ; non-démarrée ou health check => flake runner).
          $decided  = ([regex]::Matches($content, 'message="Saut du test car l.initialisation de la JVM')).Count
          $notStart = ([regex]::Matches($content, 'message="Saut du test car la JVM n.est pas')).Count
          $unhealthy= ([regex]::Matches($content, 'message="Saut du test car la JVM est d')).Count
          if ($decided   -gt 0) { Write-Host "   • $decided — init décidée-échouée (sessionstart)" }
          if ($notStart  -gt 0) { Write-Host "   • $notStart — JVM non réellement démarrée" }
          if ($unhealthy -gt 0) { Write-Host "   • $unhealthy — JVM démarrée mais non fonctionnelle" }
          if (($jvmSkipCount / $total) -gt 0.5) {
            Write-Host "❌ FAIL-LOUD: $jvmSkipCount tests ($pct%) were skipped because the JVM did not start."
            Write-Host "   The run decided nothing — a green badge here would be theater (#1385, #1019)."
            # #1873: le remède dépend de la cause ventilée, et les deux sont
            # OPPOSÉS. Conseiller "re-run" sur un échec DÉCIDÉ brûle des
            # minutes CI sur une panne déterministe — c'est exactement ce que
            # la docstring de tests/unit/test_conftest_jvm_return_1641.py
            # avait prédit ("le garde dit re-run là où le vrai remède est une
            # correction de config"). #1641 a rendu les deux discernables ;
            # ici on cesse enfin de les confondre à la sortie.
            $ventilated = $decided + $notStart + $unhealthy
            if ($ventilated -lt $jvmSkipCount) {
              Write-Host "   • $($jvmSkipCount - $ventilated) — signature JVM hors des trois messages de tests/conftest.py"
            }
            if ($ventilated -eq 0) {
              Write-Host "   Cause dominante: INDÉTERMINÉE — aucune des trois signatures conftest n'est présente."
              Write-Host "   Les skips portent le token JVM sans venir du garde de session : lire le log de"
              Write-Host "   l'étape 'Run automated tests' avant de re-lancer quoi que ce soit."
            } elseif ($decided -ge [math]::Max($notStart, $unhealthy)) {
              Write-Host "   Cause dominante: ÉCHEC DÉCIDÉ d'initialisation (initialize_jvm a retourné False)."
              Write-Host "   Ce n'est PAS un aléa: re-lancer le job ne changera rien. Causes typiques:"
              Write-Host "     - JARs Tweety absents / non téléchargeables (amont indisponible — cf. #1874)"
              Write-Host "     - Java absent du runner, ou ré-init après shutdown JVM"
              Write-Host "   Cure: corriger la config/l'approvisionnement des JARs, pas un re-run."
            } else {
              Write-Host "   Cause dominante: JVM non démarrée / non fonctionnelle après démarrage."
              Write-Host "   Profil d'aléa natif (Temurin/JVM-setup). Re-run légitime; si ça persiste,"
              Write-Host "   l'init JVM est cassée sur CI (urgent) — ne pas re-run en boucle."
            }
            exit 1
          }
          # Filet indépendant du message (majeur n°3 de la review de #1881).
          # Le ratio ci-dessus dépend d'une SIGNATURE ; celui-ci ne dépend de
          # rien qu'un futur reformulateur puisse casser. Aucune étape amont
          # n'échoue sur "0 test passé" : l'étape 9 calcule $passed, l'imprime
          # ("✅ Passed: 0 / 15010" au run 32744198742) puis le jette. Ce garde
          # était donc la seule chose entre "0 test exécuté" et un badge vert.
          #
          # Ce n'est PAS le pendule du taux brut que le commentaire ci-dessus
          # interdit : 244 skips légitimes sur 15010 ne peuvent pas rendre
          # $passed nul. Seule une suite qui n'a rien décidé le peut.
          $skipped = 0; $failures = 0; $errors = 0
          foreach ($s in @($xml.testsuites.testsuite)) {
            $skipped  += [int]$s.skipped
            $failures += [int]$s.failures
            $errors   += [int]$s.errors
          }
          $passed = $total - $errors - $failures - $skipped
          if ($passed -le 0) {
            Write-Host "❌ FAIL-LOUD: 0 test passé sur $total collectés ($skipped skipped, $($errors + $failures) en échec)."
            Write-Host "   Le run n'a décidé de rien. Aucune signature JVM ne domine, donc la cause est"
            Write-Host "   ailleurs (collecte, import, timeout) — mais un badge vert resterait du théâtre."
            exit 1
          }
          Write-Host "✅ JVM-startup guard OK — $passed test(s) passed; JVM-dependent tests ran (or skipped for legitimate non-JVM reasons)."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: |
            pytest_report.xml
            llm_egress_report.json
            **/*.log
          if-no-files-found: warn

      - name: Notify tests skipped
        if: env.API_KEYS_CONFIGURED != 'true'
        shell: pwsh
        run: |
          Write-Host "ℹ️ Automated tests skipped: API keys not configured"
          Write-Host "This is expected behavior for forks and external contributions"
          Write-Host "Tests requiring API access are marked with @pytest.mark.requires_api"