name: projet-is
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Python
  - python=3.10
  - pip

  # Core ML/Data Science
  # #1651 : pytorch 2.2.2 (fbgemm.dll) importe libiomp5md.dll par ORDINAUX
  # (703/706/707/900/904/958/961). Les builds intel-openmp 2025.x de conda-forge
  # n'exportent pas 900/904/958/961 -> WinError 182 / 0xc0000138 a l'import torch
  # (skip-storm silencieux). 2026.1.0 les exporte tous (verifie sur _246/_247/_248).
  - intel-openmp=2026.1.0
  - mkl # Force l'utilisation des librairies Intel MKL
  - tbb # Threading Building Blocks, souvent lié à MKL
  - numpy=1.25.0 # Version figée pour la stabilité binaire
  - pandas=2.0.3
  - scipy
  - scikit-learn
  - nltk
  # spacy/thinc: NO conda line on purpose (#2320). The whole spacy stack is
  # pip-managed below (spacy==3.8.14 + thinc==8.3.13 + srsly==2.5.3). A conda
  # spacy would drag conda srsly — and conda-forge's noarch srsly rebuild
  # DE-VENDORS msgpack (conda-forge policy), routing model deserialization
  # through the external msgpack, whose >=1.1 default strict_map_key=True
  # rejects fr_core_news_sm's integer map keys: spacy.load dies with
  # "int is not allowed for map key" and the quality phase raises RuntimeError.
  # With conda spacy gone, nothing installs srsly but pip, whose 2.5.3 wheel
  # vendors msgpack (1.0 semantics) exactly like the recording env.
  - pytorch
  - transformers
  - sympy=1.13.1

  # Web & API
  - flask
  - requests
  - fastapi
  - uvicorn
  - whitenoise
  - flask-cors
  - starlette
  - a2wsgi
  - asgiref

  # Utilities
  - pydantic
  - pydantic-settings
  - python-dotenv
  - cryptography
  - tqdm
  - pyyaml
  - regex
  - markdown
  - psutil
 
  # Plotting & Graphing
  - matplotlib
  - seaborn
  - statsmodels
  - networkx
  - pyvis
 
  # Logic & Reasoning
  - clingo

  # Testing
  - pytest
  - pytest-cov
  - pytest-mock
  - pytest-asyncio
  - coverage
  - unidecode
  - conda-lock
  
  # Code Quality & Formatting
  - black>=23.0.0      # Python code formatter
  - flake8>=6.0.0      # Linting tool
  - isort>=5.12.0      # Import sorter (optionnel mais recommandé)
  - mypy>=1.0.0        # Static type checker

  # La section pip est pour les paquets non disponibles ou problématiques sur Conda
  - pip:
    - textstat  # FB-23 #1088: readability (Flesch) for the quality-radar clarte detector
    - spacy==3.8.14  # #2320 (with the pins below): the quality heuristic's virtue scores feed LLM-cache KEYS, so CI must compute the recording env's scores. The whole spacy stack is pip-managed — see the conda section note.
    - thinc==8.3.13  # #2320: the working pair with spacy 3.8.14 (the dev boxes' proven stack — 79/79 replay keys match the recording env)
    - srsly==2.5.3  # #2320 layer 3: conda-forge's noarch srsly rebuild de-vendors msgpack; external msgpack>=1.1 defaults strict_map_key=True -> spacy.load("fr_core_news_sm") raises "int is not allowed for map key" (the model's tokenizer data uses integer map keys) -> quality phase RuntimeError -> counter/democratic_vote target cascades. Reproduced locally in a fresh env-from-yml and repaired by this wheel (vendored msgpack, 1.0 semantics). Pinning alone is NOT enough when conda spacy is present (pip no-ops on an equal version) — hence spacy/thinc live only in this pip section.
    - fr-core-news-sm==3.8.0  # #2320: the model the recording env used. CI never provisioned it: quality_evaluator silently degraded to "simplified tokenisation" (_load_dependencies: OSError -> _nlp=None, warn only) -> CI computed DIFFERENT scores than the recording env -> 12 replay keys existed nowhere -> gate miss_replay=31 while pytest stayed green (run 35435391692). Proven by exact key-prefix match: simulating the missing model locally reproduces 8 of the 12 CI miss prefixes. Same drift class as openai==3.3.0 below: an unpinned (here: absent) dep whose output enters cache keys is a replay-lane key-drift vector.
    - semantic-kernel>=1.33.0
    - openai==3.3.0  # Pinned. semantic-kernel declares only a floor (openai>=2.0.0), so every fresh env resolved whatever PyPI served that day. Measured 2026-08-19: CI resolved openai 3.3.0 while dev envs built months earlier sat on 2.26.0 — and openai>=3.x moved its transport from httpx to httpx2. That gap is precisely why a CI-only failure like #1794 cannot be reproduced on a dev box: the two sides do not run the same client. 3.3.0 is the version the gate actually exercises (run 32195821578, green). Same drift class as python-sat below: a floor is not a version.
    - flask_socketio>=5.3.6
    - playwright
    - pytest-playwright
    - psutil
    - tenacity
    - pybreaker
    - pytest-dotenv
    - mcp>=2.0  # #1559 : migré vers l'API mcp 2.x (FastMCP renommé MCPServer, host/port déplacés du ctor vers run()). Le pin <2 de #1558 était un sursis le temps de la migration.
    - blis
    - JPype1==1.7.1  # #2538: pinned to the version the gate exercises. The floor >=1.5.0 let CI resolve 1.7.1 while the dev envs sat on 1.6.0, so the #2519 exit repair was measured on one version and run on the other. 1.7.1 is what the gate ran green (run 35997641767: 16311 passed, 0 failed). Measured on ai-01, main 3b5e828cb, keyless, gate selection: tests/integration/workers/ (270 tests, nested JVM sessions) and tests/unit -m 'jpype or tweety' (166) give the same outcome test by test on 1.6.0 and 1.7.1, in the same time. Bring a dev env to it with pip install jpype1==1.7.1.
    - pytest-benchmark
    - tiktoken
    - hypothesis  # #1303: property tests (tests/property/) — CI collection breaks without it
    - pytest-timeout  # CI hang guard: --timeout=900 in ci.yml converts a hung test into a stack-dumped failure
    - pytest-xdist  # #2402: the xdist witness tests (test_jvm_session_flag_one_reader_2402.py, test_xdist_report_serialization_2402.py) spawn child pytest runs at `-n 1`; without the plugin the child aborts at "unrecognized arguments: -n 1" (CI run 36042911689: exactly the 3 witnesses failed). Inert for the gate's own run — it never passes -n. Same drift class as pyfakefs below: a guard that needs a plugin the env does not provision.
    - pyfakefs>=5.0.0  # #1336: provides the `fs` fixture for test_plugin_loader.py — CI errors "fixture 'fs' not found" without it
    - diskcache  # #1336: LLM response cache (llm_cache.py CachedChatCompletion). In requirements.txt but not environment.yml — CI provisions via environment.yml, so diskcache was absent on runners → CachedChatCompletion fell back to OFF mode, failing 5 test_llm_cache tests. Same drift class as pyfakefs (#1353) and hypothesis (#1303).
    # sentence-transformers deliberately NOT provisioned (#2116 A1): importing it reaches torch, whose DLLs the runner image cannot load (#1651 — probe VERDICT 4/8: torch_cpu/fbgemm/shm/torch_python, winerror 182, deterministic on 3/3 runs 2026-09-15: 35011121202, 35012607442, 35013012989). Provisioning it aborted COLLECTION of two test files (any module-level `from sentence_transformers import ...` → `import torch` → OSError; PR #2267 run 2) — green runs are green only because nothing imports torch at collection and torch-dependent tests skip. The capacity guard (test_embedding_capacity_guard_2116.py) therefore skips in CI with this reason and measures on machines where the stack loads.
    - python-sat==1.9.dev7  # #1336 / #1687 / #1696-CI: PySAT is the DEFAULT propositional-logic backend (SATHandler, sat_handler.py). pip-only (NOT on conda-forge). RECURRING drift class #1336 "listed ≠ stays-published": (1) the float broke when 1.9.dev10 shipped NO cp310-win_amd64 wheel → pip source build → cadical MSVC fail (``unistd.h``) → both CI jobs die at Setup Miniconda; #1687 pinned 1.9.dev8. (2) dev8/9/10 were then YANKED from PyPI (maintainer prunes old dev releases) → the pin itself 404s → same Setup-Miniconda death. 1.9.dev7 is the NEWEST 1.9.x survivor below the yank gap WITH a prebuilt cp310-win_amd64 wheel (verified PyPI JSON: dev1..dev7 + dev11/dev12 have wheels; dev8/9/10 absent). Closest behavioral match to the validated dev8. Fallback if dev7 is later yanked: 1.9.dev12. #1369 keeps a degraded-wrap at the orchestration boundary as honest-degraded insurance regardless.
